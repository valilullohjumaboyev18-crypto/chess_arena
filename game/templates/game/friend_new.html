{% extends "game/base.html" %}
{% block title %}Do'st bilan o'ynash{% endblock %}
{% block content %}
<div class="panel">
  <h2>Do'st bilan onlayn</h2>
  <p class="sub">Xona yarating, keyin havolani do'stingizga yuboring.</p>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="name">Ismingiz</label>
      <input type="text" id="name" name="name" placeholder="Masalan: Aziz" maxlength="40" required>
    </div>
    <button class="btn" type="submit">Xona yaratish</button>
  </form>
</div>
{% endblock %}
